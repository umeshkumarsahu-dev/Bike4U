<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B52" />
      <stop offset="100%" stop-color="#071526" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7E36" />
      <stop offset="100%" stop-color="#F26B1D" />
    </linearGradient>
  </defs>

  <!-- Rounded App Tile Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#1E3A5F" stroke-width="1.5" />

  <!-- Speed Glow Ring on Orange "4" Badge -->
  <circle cx="50" cy="14" r="8" fill="url(#orangeGrad)" />
  <text x="50" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Motorcycle Silhouette -->
  <!-- Rear Wheel -->
  <circle cx="19" cy="43" r="9" stroke="#E2E8F0" stroke-width="3" fill="none" />
  <circle cx="19" cy="43" r="3" fill="#F26B1D" />

  <!-- Front Wheel -->
  <circle cx="45" cy="43" r="9" stroke="#E2E8F0" stroke-width="3" fill="none" />
  <circle cx="45" cy="43" r="3" fill="#F26B1D" />

  <!-- Swingarm & Lower Frame -->
  <path d="M19 43 L32 37 L45 43" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Engine block -->
  <rect x="27" y="36" width="10" height="7" rx="1.5" fill="#334155" />

  <!-- Sport Fuel Tank (Signature Orange) -->
  <path d="M26 34 C 29 27, 39 28, 41 34 Z" fill="url(#orangeGrad)" />

  <!-- Rider Seat & Upswept Tail -->
  <path d="M18 31 L27 34 L25 36 L16 33 Z" fill="#E2E8F0" />

  <!-- Handlebars & Front Fork -->
  <path d="M38 31 L43 23" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M36 24 L45 23" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Front Fork to Axle -->
  <path d="M42 27 L45 43" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />
</svg>
